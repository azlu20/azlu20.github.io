<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are We Still On?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: 'Arial Black', Arial, sans-serif;
            gap: 60px;
        }

        .flashing-text {
            font-size: 4rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 20px #fff, 0 0 40px #fff;
            animation: flash 0.8s infinite;
            padding: 20px;
        }

        @keyframes flash {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 20px #fff, 0 0 40px #fff, 0 0 60px #fff;
            }
            50% {
                opacity: 0.5;
                text-shadow: none;
            }
        }

        .buttons {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-size: 2.5rem;
            font-weight: bold;
            padding: 30px 80px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .btn-yes {
            background: #2ecc71;
            color: white;
            box-shadow: 0 0 30px #2ecc71;
        }

        .btn-yes:hover {
            box-shadow: 0 0 50px #2ecc71, 0 0 80px #2ecc71;
        }

        .btn-no {
            background: #e74c3c;
            color: white;
            box-shadow: 0 0 30px #e74c3c;
        }

        .btn-no:hover {
            box-shadow: 0 0 50px #e74c3c, 0 0 80px #e74c3c;
        }

        @media (max-width: 768px) {
            .flashing-text {
                font-size: 2rem;
            }
            .btn {
                font-size: 1.5rem;
                padding: 20px 50px;
            }
        }
    </style>
</head>
<body>
    <h1 class="flashing-text">ARE WE STILL ON FOR TOMORROW?</h1>

    <div class="buttons">
        <button class="btn btn-yes" onclick="openResponse('yes')">Yes</button>
        <button class="btn btn-no" onclick="openResponse('no')">No</button>
    </div>

    <script>
        function openResponse(answer) {
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${answer === 'yes' ? 'Awesome!' : 'Oh no!'}</title>
                    <style>
                        body {
                            min-height: 100vh;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            background: ${answer === 'yes' ? '#1a4d2e' : '#4d1a1a'};
                            font-family: 'Arial Black', Arial, sans-serif;
                            color: white;
                            gap: 30px;
                            margin: 0;
                        }
                        h1 {
                            font-size: 3rem;
                        }
                        img {
                            max-width: 400px;
                            border-radius: 20px;
                            box-shadow: 0 0 30px rgba(255,255,255,0.3);
                        }
                        .countdown {
                            font-size: 1.5rem;
                            opacity: 0.8;
                        }
                    </style>
                </head>
                <body>
                    <h1>${answer === 'yes' ? 'Lol bet' : ':('}</h1>
                    <img src="${answer === 'yes' ? 'https://media.istockphoto.com/id/639765496/vector/laughing-with-tears-and-pointing-emoticon.jpg?s=612x612&w=0&k=20&c=FVVZllgAwRnQkKmgyDLw4zepwzYc0WBCxOB9N4yFdL0=' : 'https://media.tenor.com/-iiMZcIHkE8AAAAe/sad-emoji.png'}" alt="Response image">
                    <script>
                        setTimeout(() => {
                            window.location.href = '${answer === 'yes' ? 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' : 'https://www.youtube.com/watch?v=L_6Q28__BCI&list=PL4TS5FbhNUptXTDLu1kMNpt3PhArmMxOX'}';
                        }, 800);
                    <\/script>
                </body>
                </html>
            `);
            newWindow.document.close();
        }
    </script>
</body>
</html>
